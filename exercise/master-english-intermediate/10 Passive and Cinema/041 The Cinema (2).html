  <style>
    body {
      font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto,
        segoe ui, Helvetica, Arial, sans-serif, apple color emoji,
        segoe ui emoji, segoe ui symbol;
      font-weight: 400;
      line-height: 22.4px;
      font-size: 16px;
    }

    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    ul,
    ol {
      font-size: 16px;
      font-weight: 400;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-width: none;
    }

    code {
      background-color: #fff;
      border: 1px solid #d1d7dc;
      color: #b4690e;
      font-size: 90%;
      padding: 0.2rem 0.4rem;
    }

    .quiz-content {
      padding: 2.4rem;
      word-break: break-word;
      max-width: 86rem;
      margin: 0 auto;
    }

    .quiz-container {
      margin: 0 auto;
      max-width: 84rem;
      padding: 0;
    }

    .question {
      margin-bottom: 5rem;
    }

    .question span {
      font-size: 24px;
      font-weight: 700;
    }

    .question-prompt {
      margin-top: 0.8rem;
      font-weight: 700;
    }

    .question-answer {
      margin-top: 1.6rem;
      padding-left: 0;
      box-sizing: border-box;
    }

    .question-answer label {
      max-width: 80rem;
      position: relative;
      cursor: pointer;
      display: flex;
      min-width: 18rem;
      border: solid #1c1d1f 2px;
    }

    .question-answer div {
      padding: 0.5rem;
      width: 100%;
    }

    .question-answer div:hover {
      background-color: #f5f5f5;
    }

    /* .question-answer input {
      display: none;
    } */

    .question-answer span {
      width: 1rem;
      height: 1rem;
      margin-right: 1.6rem;
      top: 0;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      border: 0.2rem solid #1c1d1f;
      position: relative;
    }

    .selected {
      background: #1c1d1f;
      box-shadow: 0 0 0 0.4rem #fff inset;
    }

    .score {
      position: fixed;
      background-color: #b4690e;
      padding: 10px;
      color: white;
    }
  </style>
</head>

 hired</p>", "<p>are already hired</p>", "<p>are already being hired</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "Three hundred extras __________________ to appear in the background during the battle scenes", "related_lectures": [{"_class": "lecture", "id": 41039418, "title": "The Cinema (2)", "created": "2023-11-27T18:25:37Z", "is_published": true, "asset": {"_class": "asset", "id": 52977474, "asset_type": "Video", "title": "Cinema 2.mp4", "created": "2023-11-27T18:38:12Z"}, "object_index": 41, "url": "/course/master-english-intermediate/learn/lecture/41039418"}]}, {"_class": "assessment", "id": 73673386, "assessment_type": "multiple-choice", "prompt": {"question": "<p>The second scene ___________ on location in&nbsp;Berlin</p>", "relatedLectureIds": ["41039418"], "feedbacks": ["To be set = the plot takes place in this area, but it is often recorded in a different area", "To shoot = to record (a film). 'On location' = to record the film in the same place as the plot is supposed to happen. ", "We need passive", "We need passive", "We need passive", "We need passive"], "answers": ["<p>was set</p>", "<p>was shot</p>", "<p>shot</p>", "<p>was shooting</p>", "<p>was setting</p>", "<p>set</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "The second scene ___________ on location in&nbsp;Berlin", "related_lectures": [{"_class": "lecture", "id": 41039418, "title": "The Cinema (2)", "created": "2023-11-27T18:25:37Z", "is_published": true, "asset": {"_class": "asset", "id": 52977474, "asset_type": "Video", "title": "Cinema 2.mp4", "created": "2023-11-27T18:38:12Z"}, "object_index": 41, "url": "/course/master-english-intermediate/learn/lecture/41039418"}]}, {"_class": "assessment", "id": 73673768, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Sport _________ by spectators, but films __________ by an audience</p>", "relatedLectureIds": ["41039418"], "feedbacks": ["Wrong tense (this is always true, so present simple is     function kiemTraDapAn(correctMuti, choise) {
      // Chuyển đổi các số trong choise thành chữ cái tương ứng
      const choiseLetters = choise.map(num => String.fromCharCode(parseInt(num) + 'a'.charCodeAt(0)));
      console.log('choiseLetters',choiseLetters)
      // Kiểm tra điều kiện:
      // 1. Chiều dài hai mảng phải bằng nhau
      // 2. Tất cả các phần tử trong choiseLetters phải có trong correctMuti
      if (
        choiseLetters.length === correctMuti.length &&
        choiseLetters.every(c => correctMuti.includes(c))
      ) {
        return true;
      } else {
        return false;
      }
    }

              answer +
              "</input></div></label>";
            answerElement.classList.add("question-answer");
            answersElement.appendChild(answerElement);
          }
        }
        questionElement.appendChild(answersElement);

        // add a submit button
        var submitButton = document.createElement("button");
        submitButton.className = "submit";
        submitButton.innerHTML = "Submit";
        submitButton.classList.add("submit-button");

        submitButton.addEventListener("click", function (e) {
          e.preventDefault();
          var questionElement = e.target.parentElement;
          var questionId = questionElement.id;
          var question = questions.filter(function (q) {
            return q.id == questionId;
          })[0];

          // set the border color of all answers to black
          var answers = questionElement.getElementsByClassName("answer");
          for (var i = 0; i < answers.length; i++) {

              correct++;
              updateScore();
              questionElement.innerHTML += question.explanation

            } else {
              answer.parentElement.parentElement.style.borderColor = "red";
              // alert("Incorrect!");
            }
          }
          if (mutilanswer) {
            var answerIndex = [...mutilanswer].map(a => a.value);

            if (kiemTraDapAn(question.correctMuti, answerIndex)) {
              [...mutilanswer].map(item => {
                item.parentElement.parentElement.style.borderColor =
                "limegreen";
              })
              // alert("Correct!");

          // else {

        // add button

        questionsContainer.appendChild(questionElement);

    function select(question, answer) {
      var questionElement = document.getElementById(question);
      var answers = questionElement.getElementsByClassName("answer");
      for (var i = 0; i < answers.length; i++) {
        var span = answers[i].children[0].children[0].children[0];
        var input = answers[i].children[0].children[0].children[1];
        span.classList.remove("selected");
        input.checked = false;
      }
      var span = answers[answer].children[0].children[0].children[0];
      var input = answers[answer].children[0].children[0].children[1];
      span.classList.add("selected");
      input.checked = true;
    }

      var scoreElem = document.getElementById("score");
      const score = (correct / total) * 100;
      scoreElem.innerHTML = "Score: " + score + "/" + passPercent + "%";
