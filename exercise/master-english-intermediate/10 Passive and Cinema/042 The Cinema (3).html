    p,

      font-weight: 400;

    .quiz-container {

      max-width: 84rem;

      font-weight: 700;
    }

    .question-answer {
      margin-top: 1.6rem;
      padding-left: 0;

    .question-answer label {
      max-width: 80rem;
      position: relative;
      cursor: pointer;
      display: flex;
      min-width: 18rem;
      border: solid #1c1d1f 2px;

    .question-answer div {

      width: 100%;

      flex-shrink: 0;

      position: relative;
    }

    .selected {
      background: #1c1d1f;
      box-shadow: 0 0 0 0.4rem #fff inset;
    }

    .score {
      position: fixed;
      background-color: #b4690e;
      padding: 10px;
      color: white;
    }

    function select(question, answer) {
      var questionElement = document.getElementById(question);
      var answers = questionElement.getElementsByClassName("answer");
