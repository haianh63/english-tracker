hat we would like to focus on duration (has been smoking) in this example."], "answers": ["<p>He's just smoking a cigar; he'll be with you in a second</p>", "<p>He's just smoked a cigar; he'll be with you in a second</p>", "<p>He's just been smoking a cigar; he'll be with you in a second</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "Press choose the INCORRECT sentence:", "related_lectures": [{"_class": "lecture", "id": 42171836, "title": "Tenses and Signal Words - Part 3", "created": "2024-02-05T19:39:20Z", "is_published": true, "asset": {"_class": "asset", "id": 54460436, "asset_type": "Video", "title": "Tense signal 3.mp4", "created": "2024-02-05T19:51:33Z"}, "object_index": 3, "url": "/course/master-english-conversation-upper-intermediate-level/learn/lecture/42171836"}]}, {"_class": "assessment", "id": 80383982, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Press choose the <strong>INCORRECT</strong> sentence:</p>", "relatedLectureIds": ["42171836"], "feedbacks": ["We can use present simple, past simple, and present perfect simple with never. BUT we can't use present perfect continuous (has never been smoking = incorrect)", "We can use present simple, past simple, and present perfect simple with never. BUT we can't use present perfect continuous (has never been smoking = incorrect)", "We can use present simple, past simple, and present perfect simple with never. BUT we can't use present perfect continuous (has never been smoking = incorrect)"], "answers": ["<p>He has never smoked a cigar in his entire life</p>", "<p>He's never been smoking cigars, but he does like a pipe occasionally</p>", "<p>He never smokes cigars, but he sometimes smokes cigarettes</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "Press choose the INCORRECT sentence:", "related_lectures": [{"_class": "lecture", "id": 42171836, "title": "Tenses and Signal Words - Part 3", "created": "2024-02-05T19:39:20Z", "is_published": true, "asset mber to use present tenses (has finished, finished) after subordinating conjunctions that refers to the future (before, after, when, as soon as, if, in case, until, unless). We don't use will after these conjunctions (e.g. I will tell him when I see him)", "Remember to use present tenses (has finished, finished) after subordinating conjunctions that refers to the future (before, after, when, as soon as, if, in case, until, unless). We don't use will after these conjunctions (e.g. I will tell him when I see him)", "This is incorrect, as we only use 'will' in one clause (not both)"], "answers": ["<p>I'll have a word with him after he finishes his lunch</p>", "<p>I'll have a word with him after he has finished his lunch</p>", "<p>I'll have a word with him after he will finish his lunch</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "Press choose the INCORRECT sentence:", "related_lectures": [{"_class": "lecture", "id": 42171836, "title": "Tenses and Signal Words - Part 3", "created": "2024-02-05T19:39:20Z", "is_published": true, "asset": {"_class": "asset", "id": 54460436, "asset_type": "Video", "title": "Tense signal 3.mp4", "created": "2024-02-05T19:51:33Z"}, "object_index": 3, "url": "/course/master-english-conversation-upper-intermediate-level/learn/lecture/42171836"}]}, {"_class": "assessment", "id": 80384324, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Press choose the <strong>CORRECT</strong> sentence:</p>", "relatedLectureIds": ["42171836"], "feedbacks": ["By the time that (like before, after, if, when, as soon as, until, in case) uses a present tense (in the subordinate clause) rather than will, even though it refers to the future.", "By the time that (like before, after, if, when, as soon as, until, in case) uses a present tense (in the subordinate clause) rather than will, even though it refers to the future.", "By the time that (like before, after, if, when, as soon as, until, in case) uses a present tense (in the subordinate clause) rather than will, even though it refers to the future.", "By the time that requires future simple (will have done) for a future complete action or future continuous (will be doing) for an incomplete future action. Already always emphasizes completion."], "answers": ["<p>By the time that we get there, he'll already have left</p>", "<p>By the time that we get there, he'll already leave</p>", "<p>By the time that we get there, he's already leaving</p>", "<p>By the time that we'll get there, he'll already have left</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "Press choose the CORRECT sentence:", "related_lectures": [{"_class": "lecture", "id": 42171836, "title": "Tenses and Signal Words - Part 3", "created": "2024-02-05T19:39:20Z", "is_published": true, "asset": {"_class": "asset", "id": 54460436, "asset_type": "Video", "title": "Tense signal 3.mp4", "created": "2024-02-05T19:51:33Z"}, "object_index": 3, "url": "/course/master-english-conversation-upper-intermediate-level/learn/lecture/42171836"}]}]};

    function kiemTraDapAn(correctMuti, choise) {
      // Chuyển đổi các số trong choise thành chữ cái tương ứng
      const choiseLetters = choise.map(num => String.fromCharCode(parseInt(num) + 'a'.charCodeAt(0)));
      console.log('choiseLetters',choiseLetters)
      // Kiểm tra điều kiện:
      // 1. Chiều dài hai mảng phải bằng nhau
      // 2. Tất cả các phần tử trong choiseLetters phải có trong correctMuti
      if (
        choiseLetters.length === correctMuti.length &&
        choiseLetters.every(c => correctMuti.includes(c))
      ) {
        return true;
      } else {
        return false;
      }

    function select(question, answer) {
      var questionElement = document.getElementById(question);

        span.classList.remove("selected");
        input.checked = false;
      }
      var span = answers[answer].children[0].children[0].children[0];
      var input = answers[answer].children[0].children[0].children[1];
