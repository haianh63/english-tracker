    body {

        segoe ui emoji, segoe ui symbol;
      font-weight: 400;
      line-height: 22.4px;
      font-size: 16px;
    }

    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    ul,
    ol {
      font-size: 16px;
      font-weight: 400;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-width: none;
    }

    code {
      background-color: #fff;
      border: 1px solid #d1d7dc;
      color: #b4690e;
      font-size: 90%;
      padding: 0.2rem 0.4rem;
    }

    .quiz-content {
      padding: 2.4rem;
      word-break: break-word;
      max-width: 86rem;
      margin: 0 auto;
    }

    .quiz-container {
      margin: 0 auto;
      max-width: 84rem;
      padding: 0;
    }

    .question {
      margin-bottom: 5rem;
    }

    .question span {
      font-size: 24px;
      font-weight: 700;
    }

    .question-prompt {
      margin-top: 0.8rem;
      font-weight: 700;
    }

    .question-answer {
      margin-top: 1.6rem;
      padding-left: 0;
      box-sizing: border-box;
    }

    .question-answer label {
      max-width: 80rem;
      position: relative;
      cursor: pointer;
      display: flex;
      min-width: 18rem;
      border: solid #1c1d1f 2px;
    }

    .question-answer div {
      padding: 0.5rem;
      width: 100%;
    }

    .question-answer div:hover {
      background-color: #f5f5f5;
    }

      display: none;
    } */

    .question-answer span {

      flex-shrink: 0;
      border: 0.2rem solid #1c1d1f;
      position: relative;
    }

    .selected {
      background: #1c1d1f;
      box-shadow: 0 0 0 0.4rem #fff inset;
    }

    .score {
      position: fixed;
      background-color: #b4690e;
      padding: 10px;
      color: white;
    }
  </style>

on (it joins equal parts). We don't often hear for used as a conjunction in everyday conversation, but we often see it in literature.", "Correlative conjunctions are made of two parts (both X and Y, either X or Y, not only X but also Y), so 'for' can't be in this group. ", "For is joining two equal parts (Main Clause , (fanboys) Main Clause), so it can't be a subordinating conjunction, which join inequal parts (often, a subordinate clause to a main clause)", "We usually see for functioning as a preposition (+ noun) in everyday English, but in this sentence, it is joining twop clauses together"], "answers": ["<p>It is a coordinating conjunction</p>", "<p>It is a correlative conjunction</p>", "<p>It is a subordinating conjunction</p>", "<p>It is a preposition</p>"]}, "correct_response": ["a"], "section": "", "question_plain": "How does the word for function in the following sentence:The position of the enemy posed a serious threat to our own troops, for we were running out of food, fresh water, and ammunition.", "related_lectures": [{"_class": "lecture", "id": 42683866, "title": "Collocations - Part 4", "created": "2024-03-07T12:06:18Z", "is_published": true, "asset": {"_class": "asset", "id": 55146988, "asset_type": "Video", "title": "Collocations 2b.mp4", "created": "2024-03-07T12:18:04Z"}, "object_index": 12, "url": "/course/master-english-conversation-upper-intermediate-level/learn/lecture/42683866"}]}, {"_class": "assessment", "id": 80467168, "assessment_type": "multiple-choice", "prompt": {"question": "<p>How should the following sentence be punctuated in an exam?</p>", "relatedLectureIds": ["42683866"], "feedbacks": ["The first part of this sentence contains a long subordinate clause (incomplete thought). When we start a sentence with a subordinate clause, it is tradition to separate it from the main clause with a comma", "", "Semicolons separate main clauses from other main clauses, so this is incorrect. ", "This (who has been penalised for parking in the car park ) is a defining relative clause, so we don't use a comma before who. We are defining what type of permit holder (one who has been punished for parking in a car park)"], "answers": ["<p>If you are a permit holder who has been penalised for parking in the car park whilst correctly displaying your permit don't hesitate to get in touch.</p>", "<p>If you are a permit holder who has been penalised for parking in the car park whilst correctly displaying your permit, don't hesitate to get in touch.</p>", "<p>If you are a permit holder who has been penalised for parking in the car park; whilst correctly displaying your permit, don't hesitate to get in touch.</p>", "<p>If you are a permit holder, who has been penalised for parking in the car park whilst correctly displaying your permit, don't hesitate to get in touch.</p>"]}, "correct_response": ["b"], "section": "", "question_plain": "How should the following sentence be punctuated in an exam?", "related_lectures": [{"_class": "lecture", "id": 42683866, "title": "Collocations - Part 4", "created": "2024-03-07T12:06:18Z", "is_published": true, "asset": {"_class": "asset", "id": 55146988, "asset_type": "Video", "title": "Collocations 2b.mp4", "created": "2024-03-07T12:18:04Z"}, "object_index": 12, "url": "/course/master-english-conversation-upper-intermediate-level/learn/lecture/42683866"}]}]};

      const choiseLetters = choise.map(num => String.fromCharCode(parseInt(num) + 'a'.charCodeAt(0)));

      // Kiểm tra điều kiện:
      // 1. Chiều dài hai mảng phải bằng nhau
      // 2. Tất cả các phần tử trong choiseLetters phải có trong correctMuti
      if (
        choiseLetters.length === correctMuti.length &&
        choiseLetters.every(c => correctMuti.includes(c))
      ) {
        return true;
      } else {
        return false;
      }

          }
        }
        questionElement.appendChild(answersElement);

        // add a submit button
        var submitButton = document.createElement("button");

        submitButton.addEventListener("click", function (e) {

    function select(question, answer) {
      var questionElement = document.getElementById(question);
      var answers = questionElement.getElementsByClassName("answer");
      for (var i = 0; i < answers.length; i++) {
        var span = answers[i].children[0].children[0].children[0];
        var input = answers[i].children[0].children[0].children[1];
        span.classList.remove("selected");
        input.checked = false;
      }
      var span = answers[answer].children[0].children[0].children[0];
      var input = answers[answer].children[0].children[0].children[1];
      span.classList.add("selected");
      input.checked = true;
