    body {
      font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto,
        segoe ui, Helvetica, Arial, sans-serif, apple color emoji,
        segoe ui emoji, segoe ui symbol;
      font-weight: 400;
      line-height: 22.4px;
      font-size: 16px;
    }

    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    ul,
    ol {
      font-size: 16px;
      font-weight: 400;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-width: none;
    }

    code {
      background-color: #fff;
      border: 1px solid #d1d7dc;
      color: #b4690e;
      font-size: 90%;
      padding: 0.2rem 0.4rem;
    }

    .quiz-content {
      padding: 2.4rem;
      word-break: break-word;
      max-width: 86rem;
      margin: 0 auto;
    }

    .quiz-container {
      margin: 0 auto;
      max-width: 84rem;
      padding: 0;
    }

    .question {
      margin-bottom: 5rem;
    }

    .question span {
      font-size: 24px;
      font-weight: 700;
    }

    .question-prompt {
      margin-top: 0.8rem;
      font-weight: 700;
    }

    .question-answer {
      margin-top: 1.6rem;
      padding-left: 0;
      box-sizing: border-box;
    }

    .question-answer label {
      max-width: 80rem;
      position: relative;
      cursor: pointer;
      display: flex;
      min-width: 18rem;
      border: solid #1c1d1f 2px;
    }

    .question-answer div {
      padding: 0.5rem;
      width: 100%;
    }

    .question-answer div:hover {
      background-color: #f5f5f5;
    }

      display: none;
    } */

    .question-answer span {
      width: 1rem;
      height: 1rem;

      top: 0;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      border: 0.2rem solid #1c1d1f;
      position: relative;
    }

    .selected {
      background: #1c1d1f;
      box-shadow: 0 0 0 0.4rem #fff inset;
    }

    .score {
      position: fixed;
      background-color: #b4690e;
      padding: 10px;
      color: white;
    }
  </style>
</head>

 contemporaries (clause). As + clause = correct. The comparison is also logical - Just as his Bob's contemporaries wrote songs, Bob too wrote songs...", "Like X, Y. The comparison is illogical, because we are comparing Bob Dylan with songs. (Like the songs, Bob Dylan...)"], "answers": ["<p>Like many of his contemporaries did, Bob Dylan wrote songs that became anthems for a generation of antiwar activists.</p>", "<p>Bob Dylan wrote songs like many of his contemporaries that became anthems for a generation of antiwar activists.</p>", "<p>As did many of his contemporaries, Bob Dylan wrote songs that became anthems for a generation of antiwar activists.</p>", "<p>Like the songs of his contemporaries, Bob Dylan wrote songs that became anthems for a generation of antiwar activists.</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "In which of the following sentences have we made a logical and clear comparison? Please remember that in academic English, like is a preposition rather than a subordinating conjunction, so we must use like + noun, not like + clause.", "related_lectures": [{"_class": "lecture", "id": 42052174, "title": "Linking Words - Part 2", "created": "2024-01-29T19:25:12Z", "is_published": true, "asset": {"_class": "asset", "id": 54297576, "asset_type": "Video", "title": "Linking Words Part 2.mp4", "created": "2024-01-29T19:35:11Z"}, "object_index": 14, "url": "/course/master-english-conversation-upper-intermediate-level/learn/lecture/42052174"}]}, {"_class": "assessment", "id": 80470670, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following sentences contains a comma splice and is, therefore, <strong>incorrect</strong> in any academic essay? All the other sentences are correct</p>", "relatedLectureIds": ["42052174"], "feedbacks": ["MAIN ; conjunctive adverb , MAIN. This is 100% correct, and you will see this pattern often, if you keep an eye out for it. ", "A comma splice is when a comma is used to join two main clauses (complete sentences / full thoughts). Here we have a full stop between two main clauses ", "MAIN , however, MAIN = comma splice. However is a conjunctive adverb, but we need a conjunction to join two main clauses. To correct this mistake, separate the two main clauses with a full stop or semicolon.", "Semicolons are often used to connect two main clauses that are closely related: MAIN CLAUSE ; MAIN CLAUSE. However is interrupting one of the main clauses rather than connecting two main clauses together", "Although = subordinating conjunction, so this can join the two clauses with just a comma."], "answers": ["<p>He claimed that the quality of the work had come up to the required standard; however, the ugly truth was that standards had been slipping for many years.</p>", "<p>He claimed that the quality of the work had come up to the required standard. However, the ugly truth was that standards had been slipping for many years.</p><p><br></p>", "<p>He claimed that the quality of the work had come up to the required standard, however, the ugly truth was that standards had been slipping for many years.</p>", "<p>He claimed, however, that the quality of the work had come up to the required standard; the ugly truth was that standards had been slipping for many years.</p>", "<p>He claimed that the quality of the work had come up to the required standard, although the ugly truth was that standards had been slipping for many years.</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "Which of the following sentences contains a comma splice and is, therefore, incorrect in any academic essay? All the other sentences are correct", "related_lectures": [{"_class": "lecture", "id": 42052174, "title": "Linking Words - Part 2", "created": "2024-01-29T19:25:12Z", "is_published": true, "asset": {"_class": "asset", "id": 54297576, "asset_type": "Video", "title": "Linking Words Part 2.mp4", "created": "2024-01-29T19:35:11Z"}, "object_index": 14, "url": "/course/master-english-conversation-upper-intermediate-level/learn/lecture/42052174"}]}, {"_class": "assessment", "id": 80470712, "assessment_type": "multiple-choice", "prompt": {"question": "<p>Which of the following sentences is <strong>INCORRECT</strong>?</p>", "relatedLectureIds": ["42052174"], "feedbacks": ["Due to (preposition) noun / gerund / the fact that + clause", "Due to (preposition) noun / gerund / the fact that + clause", "Due to (preposition) noun / gerund / the fact that + clause"], "answers": ["<p>Due to the bad weather, we missed out on the opportunity to camp in the forest</p>", "<p>Due to the fact that we thought there might be rain, we missed out on the opportunity to camp in the forest</p>", "<p>Due to we thought that there might be rain</p>"]}, "correct_response": ["c"], "section": "", "question_plain": "Which of the following sentences is INCORRECT?", "related_lectures": [{"_class": "lecture", "id": 42052174, "title": "Linking Words - Part 2", "created": "2024-01-29T19:25:12Z", "is_published": true, "asset": {"_class": "asset", "id": 54297576, "asset_type": "Video", "title": "Linking Words Part 2.mp4", "created": "2024-01-29T19:35:11Z"}, "object_index": 14, "url": "/course/master-english-conversation-upper-intermediate-level/learn/lecture/42052174"}]}]};

    function kiemTraDapAn(correctMuti, choise) {
      // Chuyển đổi các số trong choise thành chữ cái tương ứng
      const choiseLetters = choise.map(num => String.fromCharCode(parseInt(num) + 'a'.charCodeAt(0)));

      // Kiểm tra điều kiện:
      // 1. Chiều dài hai mảng phải bằng nhau
      // 2. Tất cả các phần tử trong choiseLetters phải có trong correctMuti
      if (
        choiseLetters.length === correctMuti.length &&
        choiseLetters.every(c => correctMuti.includes(c))
      ) {
        return true;
      } else {
        return false;
      }
    }

              j +

            answerElement.classList.add("question-answer");
            answersElement.appendChild(answerElement);
          }
        }
        questionElement.appendChild(answersElement);

        // add a submit button
        var submitButton = document.createElement("button");
        submitButton.className = "submit";
        submitButton.innerHTML = "Submit";
        submitButton.classList.add("submit-button");

        submitButton.addEventListener("click", function (e) {
          e.preventDefault();
          var questionElement = e.target.parentElement;
          var questionId = questionElement.id;
          var question = questions.filter(function (q) {

              answer.parentElement.parentElement.style.borderColor =
                "limegreen";

              questionElement.innerHTML += question.explanation

            } else {
              answer.parentElement.parentElement.style.borderColor = "red";
              // alert("Incorrect!");
            }
          }
          if (mutilanswer) {
            var answerIndex = [...mutilanswer].map(a => a.value);

            if (kiemTraDapAn(question.correctMuti, answerIndex)) {
              [...mutilanswer].map(item => {

                "limegreen";
              })
              // alert("Correct!");
              correct++;

              questionElement.innerHTML += question.explanation

            }

          }
          // else {

          // }

        // add button
        questionElement.appendChild(submitButton);

    function select(question, answer) {
      var questionElement = document.getElementById(question);
      var answers = questionElement.getElementsByClassName("answer");
      for (var i = 0; i < answers.length; i++) {
        var span = answers[i].children[0].children[0].children[0];
        var input = answers[i].children[0].children[0].children[1];
        span.classList.remove("selected");
        input.checked = false;
      }
      var span = answers[answer].children[0].children[0].children[0];
      var input = answers[answer].children[0].children[0].children[1];
      span.classList.add("selected");
      input.checked = true;
    }
