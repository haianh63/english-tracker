    h6,

      font-weight: 400;

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-width: none;

      border: 1px solid #d1d7dc;
      color: #b4690e;

      margin: 0 auto;

    .quiz-container {

      max-width: 84rem;
      padding: 0;

    .question {

    .question span {

      font-weight: 700;
    }

    .question-answer {

      padding-left: 0;
      box-sizing: border-box;

    .question-answer label {
      max-width: 80rem;
      position: relative;
      cursor: pointer;
      display: flex;
      min-width: 18rem;
      border: solid #1c1d1f 2px;
    }

    .question-answer div {
      padding: 0.5rem;
      width: 100%;

    .question-answer div:hover {
      background-color: #f5f5f5;
    }

    .question-answer span {

      height: 1rem;

      display: inline-block;
      flex-shrink: 0;
      border: 0.2rem solid #1c1d1f;
      position: relative;

    .selected {

      box-shadow: 0 0 0 0.4rem #fff inset;
    }

    .score {
      position: fixed;
      background-color: #b4690e;
      padding: 10px;
      color: white;
    }

    function select(question, answer) {
      var questionElement = document.getElementById(question);
      var answers = questionElement.getElementsByClassName("answer");
